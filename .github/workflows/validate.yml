name: Validate workshop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/workshop-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/workshop-site/package-lock.json
      - name: Validate starter MCP configuration
        run: |
          node -e "const fs=require('fs'); const vscode=JSON.parse(fs.readFileSync('../../.vscode/mcp.json')); const cli=JSON.parse(fs.readFileSync('../../.github/mcp.json')); if(vscode.servers['developer-workbench'] || cli.mcpServers['developer-workbench']) process.exit(1)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
